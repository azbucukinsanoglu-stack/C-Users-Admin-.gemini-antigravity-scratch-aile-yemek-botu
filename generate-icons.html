<!DOCTYPE html>
<html>
<head><title>Aile Şefi - İkon Oluşturucu</title></head>
<body>
<h2>Aile Şefi PWA İkon Oluşturucu</h2>
<p>Aşağıdaki ikonları sağ tıklayıp "Resmi farklı kaydet..." ile <code>icons/</code> klasörüne kaydedin.</p>

<h3>192x192</h3>
<canvas id="icon192" width="192" height="192"></canvas>
<br><br>
<h3>512x512</h3>
<canvas id="icon512" width="512" height="512"></canvas>

<script>
function drawIcon(canvas) {
    const ctx = canvas.getContext('2d');
    const size = canvas.width;
    const r = size * 0.22; // corner radius

    // Rounded rectangle background
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();

    // Gradient background
    const gradient = ctx.createLinearGradient(0, 0, size, size);
    gradient.addColorStop(0, '#FF6B35');
    gradient.addColorStop(1, '#FF8C5E');
    ctx.fillStyle = gradient;
    ctx.fill();

    // Emoji
    ctx.font = `${size * 0.55}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🍳', size / 2, size / 2 - size * 0.02);

    // Bottom text
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = `bold ${size * 0.1}px -apple-system, sans-serif`;
    ctx.fillText('Aile Şefi', size / 2, size * 0.85);
}

drawIcon(document.getElementById('icon192'));
drawIcon(document.getElementById('icon512'));

// Auto-download links
['icon192', 'icon512'].forEach(id => {
    const canvas = document.getElementById(id);
    const link = document.createElement('a');
    link.download = id === 'icon192' ? 'icon-192.png' : 'icon-512.png';
    link.href = canvas.toDataURL('image/png');
    link.textContent = ` [${link.download} İndir]`;
    link.style.fontSize = '16px';
    canvas.parentNode.insertBefore(link, canvas.nextSibling);
});
</script>
</body>
</html>
